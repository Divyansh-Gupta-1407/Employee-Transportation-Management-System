server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ets_db
    username: ets_user
    password: ets_password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  
  cache:
    type: redis

app:
  jwt:
    secret: dGhpcyBpcyBhIHNlY3VyZSBqd3Qgc2lnbmluZyBrZXkgZm9yIGV0cyBhcHBsaWNhdGlvbg==
    expiration-ms: 86400000 # 24 hours

logging:
  level:
    com.ets: DEBUG
    org.springframework.security: WARN
